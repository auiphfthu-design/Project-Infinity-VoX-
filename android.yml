name: Android (APK y AAB)
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Generar también el AAB firmado para Play Store (necesita los secretos)"
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Preparar app con Capacitor
        run: |
          mkdir www
          cp index.html manifest.webmanifest sw.js privacidad.html www/
          cp -r icons www/icons
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: Compilar APK de prueba
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: infinity-vox-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Compilar AAB de Play Store
        if: ${{ inputs.release }}
        run: cd android && ./gradlew bundleRelease
      - name: Firmar AAB
        if: ${{ inputs.release }}
        id: sign
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
      - name: Subir AAB firmado
        if: ${{ inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: infinity-vox-aab
          path: ${{ steps.sign.outputs.signedReleaseFile }}
