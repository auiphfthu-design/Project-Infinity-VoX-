.scg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.sc{position:relative}
.sct{width:100%;display:flex;flex-direction:column;align-items:center;padding:12px 4px;border-radius:16px;border:1px solid rgba(120,190,255,.3);background:rgba(8,16,40,.5);color:#fff;font:inherit;font-size:.74rem;backdrop-filter:blur(8px)}
.sct span:not(.scp){max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sct .fav,.sct .fb{width:36px;height:36px;margin:0 0 6px;border-radius:11px;padding:5px;background:#fff;font-size:1rem}
.sct .fb{color:#fff;background:var(--a1,#2f6fed)}
.scp{width:36px;height:36px;margin-bottom:6px;border-radius:11px;border:1px dashed rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center}
.scx{position:absolute;top:-7px;right:-5px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.75);color:#fff;font-size:.85rem;display:flex;align-items:center;justify-content:center;line-height:1;border:1px solid rgba(255,255,255,.3)}
/* --- resultados estilo Google --- */
.gw{max-width:680px}
.gq{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:3px 8px 3px 18px}
.gq input{flex:1;min-width:0;border:0;background:none;color:inherit;font:inherit;font-size:1.05rem;height:42px;outline:none}
.gq button{border:0;background:none;color:inherit;font-size:1.1rem;padding:6px 9px;cursor:pointer}
.gtabs{display:flex;gap:20px;overflow-x:auto;margin:14px -2px 6px;border-bottom:1px solid var(--line);scrollbar-width:none}
.gtabs::-webkit-scrollbar{display:none}
.gtabs button{border:0;background:none;color:var(--muted);font:inherit;padding:8px 2px 10px;white-space:nowrap;border-bottom:3px solid transparent;cursor:pointer}
.gtabs button.on{color:var(--fg);border-bottom-color:var(--fg)}
.wp .gtabs button{color:rgba(255,255,255,.75)}
.wp .gtabs button.on{color:#fff;border-bottom-color:#fff}
.ov{margin-top:14px;font-size:1.02rem;line-height:1.55}
.ov p{margin:10px 0}
.hl{background:rgba(66,100,200,.6);border-radius:4px;padding:1px 3px;color:#fff}
.more{list-style:none;cursor:pointer;text-align:center;border:1px solid var(--line);border-radius:26px;padding:13px;font-weight:600;margin-top:6px}
.more::-webkit-details-marker{display:none}
.gr{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;color:inherit;text-decoration:none}
.wp .gr{background:rgba(8,16,40,.5);border-color:rgba(120,190,255,.3);backdrop-filter:blur(var(--blur,6px))}
.gh{display:flex;align-items:center;gap:10px}
.gs{font-weight:600;font-size:.95rem}
.gu{font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gt{color:var(--accent);font-size:1.2rem;margin:8px 0 6px;cursor:pointer;line-height:1.3}
.wp .gt{color:#8ab4f8}
.gd{display:flex;gap:12px;color:var(--muted);font-size:.92rem;line-height:1.45}
.wp .gd,.wp .gu{color:rgba(255,255,255,.78)}
.gi{width:84px;height:84px;border-radius:12px;object-fit:cover;flex:none;order:2}
.gc{display:flex;gap:8px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
.gc button{white-space:nowrap;border:1px solid var(--line);background:none;color:var(--accent);border-radius:20px;padding:9px 16px;font:inherit;cursor:pointer}
.wp .gc button{color:#8ab4f8}
.gh2{font-size:1.4rem;margin:26px 0 4px}
.gq2{border-bottom:1px solid var(--line)}
.gq2 summary{padding:16px 4px;font-size:1.05rem;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
.gq2 summary::-webkit-details-marker{display:none}
.gq2 summary::after{content:'⌄';opacity:.7}
.gq2[open] summary::after{content:'⌃'}
.gq2 p{margin:0 0 14px;color:var(--muted);line-height:1.5}
.wp .gq2 p{color:rgba(255,255,255,.8)}
.gimg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 8px;margin-top:12px}
.gimg .it{display:block;text-decoration:none;color:inherit;min-width:0}
.gimg .it>img{width:100%;height:140px;object-fit:cover;border-radius:12px;display:block;background:rgba(127,127,127,.15)}
.gimg .cap{display:flex;gap:6px;align-items:flex-start;margin-top:6px;min-width:0}
.gimg .cap img{width:16px;height:16px;border-radius:4px;margin:2px 0 0;flex:none;object-fit:contain}
.gimg .cap .fb{width:16px;height:16px;border-radius:4px;font-size:.6rem;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none;margin:2px 0 0}
.gimg .cap div{min-width:0;flex:1}
.gimg .cs{font-size:.72rem;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gimg .ct{font-size:.82rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.sx{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.sx a{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);text-decoration:none;font-size:.85rem}
.sx a img.fav{margin:0}
/* --- decoración + explorar + aviso --- */
#toolbar #back,#toolbar #fwd{display:inline-flex;align-items:center;justify-content:center;flex:none;width:32px;height:38px;padding:0;background:none;border:0;color:inherit}
#toolbar #back:disabled,#toolbar #fwd:disabled{opacity:.3}
#toolbar #back:active:not(:disabled),#toolbar #fwd:active:not(:disabled){transform:scale(.85)}
@keyframes vxIn{from{opacity:0;transform:translateY(10px)}}
@keyframes vxDrift{to{transform:translate(-3%,2%) scale(1.08)}}
#content>*{animation:vxIn .4s ease both}
#vxAur{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(45vmax 45vmax at 15% 10%,rgba(47,111,237,.28),transparent 60%),radial-gradient(40vmax 40vmax at 90% 85%,rgba(34,211,255,.22),transparent 60%),radial-gradient(30vmax 30vmax at 80% 15%,rgba(168,85,247,.2),transparent 60%);animation:vxDrift 22s ease-in-out infinite alternate}
.tile,.lk{transition:transform .15s,box-shadow .2s,border-color .2s}
.tile:active,.lk:active{transform:scale(.94)}
@media (hover:hover){.tile:hover,.lk:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(47,111,237,.35);border-color:var(--accent)}}
.lks{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.lk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px 6px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:inherit;font:inherit;font-size:.78rem;cursor:pointer;text-align:center}
.lk .fav,.lk .fb{width:34px;height:34px;border-radius:10px;margin:0;font-size:1rem}
.wp .lk{background:rgba(8,16,40,.5);border-color:rgba(120,190,255,.3);backdrop-filter:blur(var(--blur,6px));color:#fff}
.secT{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.05rem;margin:22px 0 10px}
.secT::before{content:'';width:5px;height:1.1em;border-radius:3px;background:var(--c,var(--accent))}
#vxToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:rgba(0,0,0,.85);color:#fff;padding:10px 18px;border-radius:20px;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;z-index:100001}
#vxToast.on{opacity:1;transform:translate(-50%,0)}
/* --- pestañas estilo Chrome --- */
#tabs.open{display:flex;top:0;left:0;right:0;bottom:0;max-height:none;z-index:9000;border-radius:0;border:0;gap:14px;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px));background:#16151a!important;backdrop-filter:none;box-shadow:none}
.tbar{display:flex;align-items:center;justify-content:space-between;flex:none}
.tplus{width:54px;height:54px;border-radius:17px;border:0;background:#4a7cff;color:#fff;font-size:2.1rem;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.tseg{display:flex;background:#2a2b33;border-radius:28px;padding:4px;gap:2px}
.tseg button{min-width:58px;height:46px;border:0;border-radius:24px;background:none;color:#fff;font:inherit;font-weight:700;padding:0 16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.tseg button.on{background:#14151a}
.tcnt{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 4px;border:2.5px solid #fff;border-radius:8px;font-size:.85rem}
.tx{width:46px;height:46px;border:0;background:none;color:#fff;font-size:1.4rem;cursor:pointer}
.tsr{flex:none;width:100%;height:56px;border:0;border-radius:28px;background:#25262f;color:#fff;padding:0 24px;font:inherit;font-size:1.05rem;outline:none}
.tsr::placeholder{color:#c8cbd8}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;flex:none}
.tcard{background:#22232b;border-radius:26px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:8px;color:#fff;transition:transform .15s}
.tcard:active{transform:scale(.97)}
.tcard.on{background:#4a7cff}
.tch{display:flex;align-items:center;gap:8px;padding:4px 2px 0 6px;min-width:0}
.tct{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:1rem}
.tch b{font-weight:400;padding:6px 8px;font-size:1.1rem}
.tci{width:24px;height:24px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:.95rem}
.tci .fav,.tci .fb{width:24px;height:24px;margin:0;border-radius:7px}
.tci .ic{width:22px;height:22px}
.tcp{aspect-ratio:3/4;border-radius:20px;background:#2f3039;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;text-align:center;color:#fff}
.tcard.on .tcp{background:#14151a}
.tcp.hm{background:var(--wpimg);background-size:cover;background-position:center}
.tck{font-size:1.7rem;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.tcb .fav,.tcb .fb{width:46px;height:46px;border-radius:13px;margin:0;font-size:1.4rem}
.tcb .ic{width:44px;height:44px}
.tcb{display:flex;font-size:2.2rem}
.tcn{font-size:.78rem;opacity:.75;word-break:break-all}

/* --- Perfil --- */
.pfb{position:relative;height:150px;border-radius:20px;background-size:cover;background-position:center;overflow:hidden}
.pfa{width:104px;height:104px;border-radius:50%;margin:-52px auto 0;position:relative;border:4px solid var(--bg);display:flex;align-items:center;justify-content:center;font-size:2.6rem;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--a1,#2f6fed),var(--a2,#12c4ff));overflow:hidden;box-shadow:0 0 24px rgba(0,170,255,.45)}
.pfa img{width:100%;height:100%;object-fit:cover}
.pfb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bgl{display:flex;gap:8px;overflow-x:auto;margin:8px 0 14px;padding-bottom:4px}
.bgi{position:relative;flex:none;width:110px;height:62px;border-radius:12px;border:3px solid transparent;background:var(--card) center/cover;overflow:hidden;cursor:pointer}
.bgi.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.bgi video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.bgi i{position:absolute;left:4px;bottom:3px;font-style:normal;font-size:.7rem;background:rgba(0,0,0,.6);color:#fff;border-radius:8px;padding:1px 6px}
.bgi u{position:absolute;right:3px;top:3px;text-decoration:none;font-size:.7rem;background:rgba(0,0,0,.65);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.pfn{text-align:center;font-size:1.5rem;font-weight:800;margin:8px 0 0}
.pfu{text-align:center;color:var(--muted);margin:0}
.pfs{text-align:center;margin:8px auto 0;display:table;padding:5px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:.88rem}
.pfbio{text-align:center;margin:10px 0 0;line-height:1.45}
.pfst{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.pfst div{text-align:center;padding:10px 4px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(8,12,28,.62);color:#fff;font-size:.72rem}
.pfst b{display:block;font-size:1.25rem}
.pfi{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.pfi span{padding:4px 11px;border-radius:14px;background:var(--accent);color:#fff;font-size:.8rem}
.pfsw{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 14px}
.pfsw button{width:44px;height:44px;border-radius:50%;border:3px solid transparent;padding:0}
.pfsw button.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.pfem{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.pfem button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:1.3rem;padding:0}
.pfem button.on{background:var(--accent);border-color:var(--accent)}
.pfc label{display:block;margin:12px 0 4px;font-weight:700}
.pfc .tg{display:flex;align-items:center;gap:10px;font-weight:400;margin:8px 0}
.cn.l{overflow:hidden;padding:0}

/* === Logo y nombre en el inicio (en lugar de la hora) === */
.brand{display:flex;flex-direction:column;align-items:center;gap:8px;margin:2px 0 6px}
.brand .bl{width:88px;height:88px;border-radius:50%;object-fit:cover;box-shadow:0 0 30px rgba(0,190,255,.5)}
.brand .bn{font-size:2.1rem;font-weight:800;letter-spacing:-.5px;line-height:1.1;text-align:center}
.brand .bn b{color:var(--accent)}
.wp .brand .bn{color:#fff;text-shadow:0 0 26px rgba(34,211,255,.55)}
.wp .brand .bn b{color:#22d3ff}
.tcl{width:56px;height:56px;border-radius:50%;object-fit:cover;box-shadow:0 0 16px rgba(0,190,255,.45)}
.tck{font-size:1.1rem!important}
/* === Etiqueta "en proceso" === */
.wip{font-size:.62rem;font-weight:400;opacity:.72;letter-spacing:.02em;margin-left:5px}
.gtabs .wip{display:block;margin:1px 0 0;text-align:center}
/* === Versión para computadora / pantallas grandes === */
@media (min-width:900px){
  *{scrollbar-width:thin;scrollbar-color:rgba(127,127,127,.45) transparent}
  #content{padding:28px 40px}
  .wrap{max-width:880px}
  .gw{max-width:920px}
  #toolbar,#bar{width:100%;max-width:1120px;margin-left:auto;margin-right:auto}
  .scg{grid-template-columns:repeat(6,1fr)}
  .lks{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
  .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
  .gimg{grid-template-columns:repeat(4,1fr)}
  .gimg .it>img{height:150px}
  .vn{max-width:900px}
  .vb{max-width:80%}
  #menu{right:max(8px,calc((100vw - 1120px)/2 + 8px))}
  #tabs.open{padding-left:max(24px,calc((100vw - 1200px)/2));padding-right:max(24px,calc((100vw - 1200px)/2))}
  #tabs.open .tgrid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  .tcp{aspect-ratio:4/3}
  .tsr{max-width:640px;align-self:center}
  button,.tab,.tcard,.tile,.lk,.sct,.row .t,.gt{cursor:pointer}
  #toolbar button:hover:not(:disabled),#toolbar #pill button:hover{background:rgba(255,255,255,.1)}
  .btn:hover,.chip:hover,.tseg button:hover,#menu button:hover,#em button:hover{filter:brightness(1.15)}
  #menu button:hover,#em button:hover{background:rgba(255,255,255,.08)}
  .tcard:hover{transform:translateY(-2px)}
  :focus-visible{outline:2px solid #22d3ff;outline-offset:2px}
}
@media (min-width:1500px){
  .wrap{max-width:980px}
  .scg{grid-template-columns:repeat(8,1fr)}
}
@media (min-width:900px){ .brand .bl{width:104px;height:104px} .brand .bn{font-size:2.6rem} }

  const expr=()=>{let v=term();while(tk[i]==='+'||tk[i]==='-'){const o=tk[i++],r=term();v=o==='+'?v+r:v-r}return v};
  const v=expr();if(i!==tk.length)throw new Error('x');return v;

 for(const k in VTP){let n=(VTP[k][0].test(q)?3:0)+(VTP[k][0].test(h)?1:0);sc[k]=n;if(n>bs){bs=n;best=k}}
 return best?VTP[best][1]:{t:.7,p:.9}}
async function direct0(eng,key,msgs,T){
  const J=async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error((j.error&&(j.error.message||j.error))||('Error '+r.status));return j};
  if(eng==='g0d'){const c=VC(),base=(c.gu||'').replace(/\/+$/,'');if(!base)throw new Error('Falta la dirección de tu servidor G0DM0D3.');
    const j=await J(await fetch(base+'/v1/chat/completions',{method:'POST',headers:Object.assign({'content-type':'application/json'},c.gk?{authorization:'Bearer '+c.gk}:{}),body:JSON.stringify({model:c.gm||MOD.g0d,messages:[{role:'system',content:SYS},...msgs],openrouter_api_key:key||undefined,max_tokens:1024,autotune:true,godmode:false,parseltongue:false,stm_modules:[],contribute_to_dataset:false})}));return(j.choices&&j.choices[0].message.content)||'(sin respuesta)'}
  if(eng==='gemini'){const bd=JSON.stringify({generationConfig:T?{temperature:T.t,topP:T.p}:undefined,systemInstruction:{parts:[{text:SYS}]},contents:msgs.map(x=>({role:x.role==='user'?'user':'model',parts:[{text:x.content}]}))});let last;
    for(const mo of [MOD.gemini,'gemini-3.8-flash','gemini-3.6-flash']){try{const j=await J(await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+mo+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':key},body:bd}));return(((j.candidates||[{}])[0].content||{parts:[]}).parts||[]).map(p=>p.text||'').join('')||'(sin respuesta)'}catch(e){last=e;if(!/no longer available|not found|not supported|deprecated/i.test(e.message||''))throw e}}
    throw last}
  if(eng==='claude'){const j=await J(await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:MOD.claude,max_tokens:1024,temperature:T?Math.min(T.t,1):undefined,system:SYS,messages:msgs})}));return j.content.filter(b=>b.type==='text').map(b=>b.text).join('')||'(sin respuesta)'}
  const u=eng==='grok'?'https://api.x.ai/v1/chat/completions':'https://api.openai.com/v1/chat/completions';
  const j=await J(await fetch(u,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+key},body:JSON.stringify({model:MOD[eng],temperature:T?T.t:undefined,top_p:T?T.p:undefined,messages:[{role:'system',content:SYS},...msgs]})}));return j.choices[0].message.content||'(sin respuesta)'}
async function direct(eng,key,msgs){try{return await direct0(eng,key,msgs,vtune(msgs))}catch(e){if(/temperature|top_?p|sampling/i.test(e.message||''))return direct0(eng,key,msgs,null);throw e}}

ACT.vnsend=async()=>{
  const i=$('#vni');if(!i||busy)return;const q=i.value.trim();if(!q)return;
  const c=VC(),m=$('#vnm');
  const eng=c.eng,key=c.keys[eng];
  if(!c.url&&(eng==='g0d'?!c.gu:!key)){$('#vns').style.display='block';$('#vnk').focus();return}
  if(!VM.length)m.innerHTML='';
  i.value='';i.style.height='auto';
  VM.push({r:'u',t:q});m.insertAdjacentHTML('beforeend',bub('u',q));
  const w=document.createElement('div');w.className='vb a';w.textContent='…';m.appendChild(w);m.scrollTop=m.scrollHeight;
  busy=true;let out='',bad=false;
  try{
    const ms=VM.slice(-20).map(x=>({role:x.r==='u'?'user':'assistant',content:x.t}));while(ms.length&&ms[0].role!=='user')ms.shift();
    if(c.url){const r=await fetch(c.url+'/api/chat',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},c.tok?{'x-venai-token':c.tok}:{}),body:JSON.stringify({engine:eng,messages:ms,tune:vtune(ms)})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Error '+r.status));out=j.reply||'(sin respuesta)'}
    else out=await direct(eng,key,ms);
    VM.push({r:'a',t:out});
  }catch(e){bad=true;VM.pop();i.value=q;out='⚠️ '+((e instanceof TypeError||/failed to fetch|networkerror|load failed/i.test(e.message||''))?(c.url?'No pude conectar con tu servidor ('+c.url+'). ¿Está encendido?':'No pude conectar con la IA. Revisá tu internet y abrí este archivo en Chrome (no dentro de WhatsApp ni de otra app).'):e.message)}
  w.innerHTML=md(out);busy=false;m.scrollTop=m.scrollHeight;
  VM=VM.slice(-60);store.set('venai_chat',VM);
  if(c.voz&&!bad)say(out);
};

/* Atajos de teclado para computadora: "/" o Ctrl+K = barra de direcciones, Esc = cerrar paneles */
(function(){
  var typing=function(t){return t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable)};
  document.addEventListener('keydown',function(e){
    try{
      if(e.key==='Escape'){
        document.querySelectorAll('#tabs.open,#em.open').forEach(function(x){x.classList.remove('open')});
        ['#menu','#sug'].forEach(function(q){var x=document.querySelector(q);if(x)x.style.display=''});
        if(typing(e.target))e.target.blur();
        return;
      }
      var k=(e.key||'').toLowerCase();
      if((k==='k'&&(e.ctrlKey||e.metaKey))||(e.key==='/'&&!typing(e.target)&&!e.ctrlKey&&!e.metaKey&&!e.altKey)){
        var u=document.getElementById('url');
        if(u&&u.offsetParent){e.preventDefault();u.focus();u.select()}
      }
    }catch(x){}
  });
})();
</script>
